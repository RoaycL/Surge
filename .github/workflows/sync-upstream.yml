name: Sync upstream Surge modules

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-upstream.yml'
      - 'scripts/sync_upstream.py'
      - 'tests/upstream_runtime.cjs'
      - 'tests/test_converter.py'
      - 'upstreams/FanQieNovel.plugin'

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch, convert and validate upstream sources
        run: python3 scripts/sync_upstream.py
      - name: Converter regression tests
        run: python3 -m unittest discover -s tests -p 'test_converter.py'
      - name: Adapter behavior tests
        run: node tests/upstream_runtime.cjs
      - name: Commit only validated generated files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add upstreams/*.snippet upstreams/lock.json Module/Pinduoduo.sgmodule Module/hlwxx_remove_ads.sgmodule Module/Weibo.sgmodule Module/FanQieNovel.sgmodule Module/TxvideoAD.sgmodule JS/hlwxx_remove_ads.surge.js JS/Weibo.surge.js JS/Txvideoad.surge.js
          if git ls-files --error-unmatch JS/Pinduoduo.surge.js >/dev/null 2>&1; then
            git add -u -- JS/Pinduoduo.surge.js
          fi
          if git diff --cached --quiet; then
            echo 'Upstream unchanged; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync upstream Surge modules'
          gh auth setup-git
          git push origin HEAD:main
