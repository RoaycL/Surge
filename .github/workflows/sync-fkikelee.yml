name: Sync FKIKelee Loon modules

on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-fkikelee.yml'
      - 'scripts/convert_loon.py'
      - 'scripts/loon_*.tpl'
      - 'scripts/build_catalog.py'
      - 'scripts/merge_fanqie.py'
      - 'upstreams/FanQieNovel.yfamilys.plugin'
      - 'scripts/run_checks.sh'
      - 'tests/argument_probe.cjs'

permissions:
  contents: write

concurrency:
  group: generated-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out latest RoaycL/fkikelee
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RoaycL/fkikelee
          path: work-fkikelee
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Ensure jq
        run: command -v jq || (sudo apt-get update && sudo apt-get install -y jq)
      # The converter fails on any unreviewed syntax, resource or jq change, so a
      # new upstream construct stops here instead of publishing a partial module.
      - name: Convert Loon plugins
        run: python3 scripts/convert_loon.py --source work-fkikelee
      - name: All repository checks
        run: bash scripts/run_checks.sh
      - name: Commit only validated generated files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A -- README.md docs/fkikelee.md upstreams/fkikelee JS/FKIKelee Module Ruleset
          if git diff --cached --quiet; then
            echo 'FKIKelee unchanged; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: sync FKIKelee modules ($(git -C work-fkikelee rev-parse --short HEAD))"
          gh auth setup-git
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
